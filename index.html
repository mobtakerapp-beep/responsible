<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>المسؤولية – تحدي الصور</title>
<style>
:root{--bg:#fdf6e9;--cd:#fff;--tx:#2b2b3a;--ac:#c62f4a;--ok:#2e9d5b;--no:#d9534f;--bd:#e8d9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--cd:#2a2735;--tx:#f1eee8;--bd:#443f55}}
:root[data-theme="dark"]{--bg:#1d1b24;--cd:#2a2735;--tx:#f1eee8;--bd:#443f55}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;padding:14px;font-size:20px}
#app{max-width:640px;margin:auto}h1{text-align:center;margin:6px;font-size:30px}.sub{text-align:center;color:var(--ac);margin:0 0 12px;font-size:20px}
.b,.o{display:block;width:100%;margin:10px 0;padding:15px;border-radius:14px;font:inherit;font-size:21px;cursor:pointer}
.b{background:var(--ac);color:#fff;border:0}.o{border:3px solid var(--bd);background:var(--cd);color:var(--tx)}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--no);color:#fff;border-color:var(--no)}
.pic{width:100%;aspect-ratio:1;max-height:48vh;margin:auto;border-radius:18px;background-size:cover;background-position:center;border:4px solid var(--bd)}
.q{font-size:24px;text-align:center;margin:12px 0;font-weight:bold}.st{display:flex;justify-content:space-between;font-size:18px}.msg{text-align:center;min-height:28px;margin:6px}
.big{text-align:center;font-size:30px;font-weight:bold;margin:26px 0;line-height:1.8}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cd{aspect-ratio:1;border-radius:14px;border:4px solid var(--bd);background:var(--ac);background-size:cover;background-position:center;font-size:38px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.cd.dn{border-color:var(--ok);opacity:.65;pointer-events:none}
.ft{text-align:center;margin:24px auto 8px;padding-top:12px;border-top:2px dashed var(--bd);font-size:17px;line-height:1.9;max-width:640px}
</style></head><body><div id="app"></div>

const C=["يجهّز حقيبته المدرسية","يعيد الأدوات إلى مكانها","يسقي النبتة","يرتّب الكتب في المكتبة","يجهّز مائدة الطعام","يعيد الجهاز اللوحي إلى مكانه"];
const Q=[["من يجهّز حقيبتي؟","أنا بنفسي","يجهّزها غيري دائمًا","لا أحتاج حقيبة"],["بعد استخدام أغراضي…","أعيدها إلى مكانها","أتركها أينما كانت","أخبّئها"],["أؤدّي مهمّتي…","بإتقان","بإهمال","في آخر لحظة"],["من مسؤوليتي في الفصل…","الحفاظ على نظافته وترتيبه","ترك الفوضى لغيري","الانتظار حتى يطلب المعلم"],["الشخص المسؤول يتحمّل نتيجة…","أفعاله","أفعال غيره فقط","لا شيء"],["نسيت واجبي، فالتصرّف المسؤول أن…","أعترف وأنجزه في أقرب وقت","ألقي اللوم على غيري","أكتب عذرًا كاذبًا"]];
const QP=[0,1,2,5,4,3];
const $=s=>document.querySelector(s),A=$('#app'),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const img=k=>`style="background-image:url(${D[k]})"`;
function home(){quiz()}
function opts(list,right,cb){A.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=b.textContent==right;A.querySelectorAll('.o').forEach(x=>{if(x.textContent==right)x.classList.add('ok');x.onclick=null});if(!ok)b.classList.add('no');setTimeout(()=>cb(ok),1300)})}
function quiz(){const order=sh([0,1,2,3,4,5]);let n=0,sc=0;
const step=()=>{if(n==6){const st=sc>=6?'⭐⭐⭐':sc>=4?'⭐⭐':'⭐';A.innerHTML=`<div class="big">🏆 نتيجتك ${sc} من 6<br>${st}</div><button class="b" id="r">🔄 العب من جديد</button>`;$('#r').onclick=quiz;return}
const i=order[n],[q,a,...w]=Q[i];
A.innerHTML=`<div class="st"><span>السؤال ${n+1} من 6</span><span>النقاط: ${sc}</span></div><div class="pic" ${img(QP[i])}></div><p class="q">${q}</p>${sh([a,...w]).map(t=>`<button class="o">${t}</button>`).join('')}`;
opts(0,a,ok=>{if(ok)sc++;n++;step()})};step()}
home();
</script></body></html>
